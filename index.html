<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultor Fiscal — Pão &amp; Tradição</title>
<style>
:root{--azul:#13215E;--ouro:#B07B2A;--ouro-claro:#EFAD4C;--creme:#F5F0DC;--linha:rgba(19,33,94,.1);--cinza:#f7f6f3;--verde:#1D9E75;--vermelho:#C0392B;--texto-2:#6b6b6b;--texto-3:#9a9a96;--amarelo:#B8860B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#EEF0F4;color:var(--azul);line-height:1.45;padding:0}
.wrap{max-width:100%;margin:0;padding:18px 22px 60px}
.top{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(19,33,94,.06)}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;flex-shrink:0}
.top h1{font-size:19px;font-weight:700}
.top .sub{font-size:12px;color:var(--texto-2);font-weight:400}
.base-status{margin-left:auto;font-size:12px;text-align:right;color:var(--texto-2)}
.base-status b{color:var(--azul)}

.card{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(19,33,94,.05)}
.card h2{font-size:15px;color:var(--azul);margin-bottom:12px}

.search-row{display:flex;gap:10px;flex-wrap:wrap}
.search-row input{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;font-size:15px;font-family:inherit}
.search-row input:focus{outline:none;border-color:var(--ouro-claro)}
.btn{border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-p{background:var(--azul);color:#fff}
.btn-p:hover{background:#1c2f7e}
.btn-o{background:var(--ouro-claro);color:var(--azul)}
.hint{font-size:12px;color:var(--texto-3);margin-top:8px}

.resultado{display:none}
.res-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--linha);margin-bottom:14px}
.res-head .nome{font-size:17px;font-weight:700;flex:1;min-width:200px}
.res-head .ean{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--texto-2);background:var(--cinza);padding:3px 9px;border-radius:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.fisc{background:var(--cinza);border-radius:10px;padding:11px 13px}
.fisc .lbl{font-size:11px;color:var(--texto-3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.fisc .val{font-size:16px;font-weight:700}

.bloco-titulo{font-size:13px;font-weight:700;color:var(--azul);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.bloco-titulo::before{content:"";width:4px;height:15px;background:var(--ouro-claro);border-radius:2px}

.sugestao{background:#FBF7EC;border:1px solid var(--ouro-claro);border-radius:12px;padding:14px 16px;margin-top:6px}
.sugestao .par{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.sugestao .par .item{flex:1;min-width:120px}
.sugestao .par .lbl{font-size:11px;color:var(--texto-2);text-transform:uppercase;margin-bottom:2px}
.sugestao .par .big{font-size:22px;font-weight:800;color:var(--azul)}
.sugestao .motivo{font-size:13px;color:#5a4a25;line-height:1.5}
.sugestao .ref{font-size:11.5px;color:var(--texto-2);margin-top:6px;font-style:italic}
.aviso{background:#FDF3E7;border-left:3px solid var(--amarelo);padding:8px 12px;margin-top:10px;font-size:12.5px;color:#7a5a10;border-radius:0 8px 8px 0}
.aviso b{color:var(--amarelo)}
.disclaimer{background:#FDECEC;border-left:3px solid var(--vermelho);padding:10px 12px;margin-top:12px;font-size:12.5px;color:#7a2520;border-radius:0 8px 8px 0}

.ocorrencias{margin-top:8px;font-size:12.5px;color:var(--texto-2)}
.ocorrencias table{width:100%;border-collapse:collapse;margin-top:6px}
.ocorrencias th,.ocorrencias td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linha);font-size:12px}
.ocorrencias th{color:var(--texto-3);font-weight:600;text-transform:uppercase;font-size:10.5px}

.divergencia{background:#FDF3E7;border:1px solid var(--amarelo);border-radius:10px;padding:10px 13px;margin-top:10px;font-size:12.5px;color:#7a5a10}

.multi{margin-top:10px}
.multi-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--linha);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background .12s}
.multi-item:hover{background:var(--cinza)}
.multi-item .n{font-weight:600;font-size:14px}
.multi-item .m{font-size:12px;color:var(--texto-2)}
.multi-item .seta{color:var(--ouro);font-size:18px}

.vazio{text-align:center;padding:30px 20px;color:var(--texto-2)}
.vazio .ic{font-size:34px;margin-bottom:8px;opacity:.4}
.web-box{background:#EEF4FF;border:1px solid #C5D4F0;border-radius:12px;padding:14px 16px;margin-top:12px}
.web-box h3{font-size:13px;color:var(--azul);margin-bottom:6px}
.web-box .ncm-desc{font-size:13px;color:var(--texto-2);line-height:1.5}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--linha);border-top-color:var(--azul);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.cbtn{background:transparent;border:none;color:var(--ouro);cursor:pointer;font-size:15px;padding:0 4px;vertical-align:middle;opacity:.75}
.cbtn:hover{opacity:1}
.cbtn.ok{color:var(--verde)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--azul);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
.toast.show{opacity:1}
</style>
</head>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const cfg={apiKey:"AIzaSyBV5WEkyzLL6bGBKGDVitgDAh8WO8SF76o",authDomain:"gestaopaoetradicao.firebaseapp.com",projectId:"gestaopaoetradicao"};
const app=initializeApp(cfg); const db=getFirestore(app); const auth=getAuth(app);
const MAXCHUNK=300000;
window._fbPronto=false;
onAuthStateChanged(auth,u=>{ window._fbUser=u||null; window._fbPronto=true; });
window.fbLogin=(email,senha)=>signInWithEmailAndPassword(auth,email,senha);
window.fbSalvar=async(chave,dados)=>{
  const json=JSON.stringify(dados);
  if(json.length<=MAXCHUNK){
    await setDoc(doc(db,"gestao",chave),{valor:json,chunked:false,atualizadoEm:new Date().toISOString()});
    return true;
  }
  const n=Math.ceil(json.length/MAXCHUNK);
  for(let i=0;i<n;i++) await setDoc(doc(db,"gestao",chave+"_p"+i),{valor:json.slice(i*MAXCHUNK,(i+1)*MAXCHUNK)});
  await setDoc(doc(db,"gestao",chave),{chunked:true,partes:n,atualizadoEm:new Date().toISOString()});
  return true;
};
window.fbCarregar=async(chave)=>{
  const s=await getDoc(doc(db,"gestao",chave));
  if(!s.exists()) return null;
  const d=s.data();
  if(!d.chunked) return JSON.parse(d.valor);
  let txt="";
  for(let i=0;i<d.partes;i++){ const p=await getDoc(doc(db,"gestao",chave+"_p"+i)); if(p.exists()) txt+=p.data().valor; }
  return JSON.parse(txt);
};
</script>

    r.onsuccess=e=>res(e.target.result);

}
function lerNotas(db){
  return new Promise((res)=>{
    if(!db.objectStoreNames.contains('notas')){ res([]); return; }
    const tx=db.transaction('notas','readonly').objectStore('notas').getAll();
    tx.onsuccess=()=>res(tx.result||[]);
    tx.onerror=()=>res([]);
  });
}

// ---------- Parse dos itens de uma NF-e ----------
function txt(node,tag){ const el=node.getElementsByTagName(tag)[0]; return el?el.textContent.trim():''; }
function parseItensNota(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) return null;
  const emit=doc.getElementsByTagName('emit')[0];
  const fornNome=emit?(txt(emit,'xFant')||txt(emit,'xNome')):'';
  const fornCnpj=emit?txt(emit,'CNPJ'):'';
  const ide=doc.getElementsByTagName('ide')[0];
  const dt=ide?(txt(ide,'dhEmi')||txt(ide,'dEmi')).slice(0,10):'';
  const nNF=ide?txt(ide,'nNF'):'';
  const crt=emit?txt(emit,'CRT'):'';
  const dets=doc.getElementsByTagName('det');
  const itens=[];
  for(const det of dets){
    const prod=det.getElementsByTagName('prod')[0]; if(!prod) continue;
    const icmsBloco=det.getElementsByTagName('ICMS')[0];
    let cst='',csosn='',orig='',pICMS='',pFCP='',pRedBC='',pMVAST='',pICMSST='';
    if(icmsBloco){
      cst=txt(icmsBloco,'CST'); csosn=txt(icmsBloco,'CSOSN'); orig=txt(icmsBloco,'orig');
      pICMS=txt(icmsBloco,'pICMS'); pFCP=txt(icmsBloco,'pFCP'); pRedBC=txt(icmsBloco,'pRedBC');
      pMVAST=txt(icmsBloco,'pMVAST'); pICMSST=txt(icmsBloco,'pICMSST');
    }
    const temST = !!(txt(det,'vICMSST')||pICMSST||['10','30','60','70'].includes(cst)||['201','202','203','500'].includes(csosn));
    // PIS / COFINS / IPI (CST de entrada)
    const pisB=det.getElementsByTagName('PIS')[0];
    const cofinsB=det.getElementsByTagName('COFINS')[0];
    const ipiB=det.getElementsByTagName('IPI')[0];
    const pisCst=pisB?txt(pisB,'CST'):'';
    const cofinsCst=cofinsB?txt(cofinsB,'CST'):'';
    const ipiCst=ipiB?txt(ipiB,'CST'):'';
    itens.push({
      ean:txt(prod,'cEAN')||txt(prod,'cEANTrib')||'',
      cprod:txt(prod,'cProd'),
      nome:txt(prod,'xProd'),
      ncm:txt(prod,'NCM'),
      cest:txt(prod,'CEST'),
      cfop:txt(prod,'CFOP'),
      unid:txt(prod,'uCom'),
      cst:cst, csosn:csosn, orig:orig,
      pICMS:pICMS, pFCP:pFCP, pRedBC:pRedBC, pMVAST:pMVAST,
      pis:pisCst, cofins:cofinsCst, ipi:ipiCst,
      temST:temST,
      fornNome:fornNome, fornCnpj:fornCnpj, data:dt, nNF:nNF, crt:crt
    });
  }
  return itens;
}

async function carregarBase(){
  try{
    const db=await abrirBase();
    NOTAS=await lerNotas(db);
    INDICE=[];
    for(const nota of NOTAS){
      if(!nota.xmlText) continue;
      const itens=parseItensNota(nota.xmlText);
      if(itens) INDICE.push(...itens);
    }
    carregado=true;
    document.getElementById('baseStatus').innerHTML='<b>'+NOTAS.length+'</b> notas · <b>'+INDICE.length+'</b> itens na base';
  }catch(e){
    document.getElementById('baseStatus').textContent='Base vazia ou indisponível';
    console.warn('Erro base:',e);
  }
}

// ---------- Regras de derivação ENTRADA -> SAÍDA (Regime Normal, RJ, revenda) ----------
function nomeOrigem(o){
  const m={'0':'Nacional','1':'Estrangeira (importação direta)','2':'Estrangeira (mercado interno)','3':'Nacional (imp. 40-70%)','4':'Nacional (processo básico)','5':'Nacional (imp. até 40%)','6':'Estrangeira s/ similar','7':'Estrangeira merc. interno s/ similar','8':'Nacional (imp. >70%)'};
  return (m[o]||o)+' ('+o+')';
}
function derivarSaida(item){
  const cst2=(item.cst||'').slice(-2);
  // Origem de saída: revenda no RJ -> sugerimos Nacional (0) como padrão.
  const origSaida='0';
  const sug={obs:[], origSaida:origSaida, origEntrada:item.orig||'0'};
  // Compra de fora do RJ? CFOP de entrada iniciado em 6 (ou 2 na ótica do comprador) indica interestadual.
  const cfopEnt=(item.cfop||'');
  sug.interestadual = cfopEnt.startsWith('6') || cfopEnt.startsWith('2');
  if(sug.interestadual){
    sug.obs.push('Compra veio de fora do RJ (CFOP '+cfopEnt+'). Na sua venda dentro do estado o CFOP passa a ser 5xxx, como sugerido acima.');
  }

  // ----- PIS / COFINS / IPI -----
  // Regra por NCM: padrão CST 01 tributado (0,65%/3%). Monofásicos (bebidas frias) -> 04 (revenda alíq. zero).
  // Cesta básica (alíquota zero legal) -> 06. IPI saída sempre 53 / 0%.
  const ncm=(item.ncm||'').replace(/\D/g,'');
  const pfx=(arr)=>arr.some(p=>ncm.startsWith(p));
  // Bebidas frias monofásicas (Lei 10.833/2003 art.58-A): refrigerante, cerveja, água, isotônico, energético, prep. p/ refrigerante
  const monofasico = pfx(['2201','2202','2203']) || ncm==='21069010' || pfx(['22086000','22071010']);
  // Cesta básica / alíquota zero (Lei 10.925/2004): queijos frescos 0406.10, leite, ovos, hortifruti, arroz, farinhas, pães.
  // Exceção: queijo ralado 0406.20 (parmesão) NÃO tem alíquota zero -> cai no tributado 01.
  const cestaBasica = (
    ncm.startsWith('040610') ||
    ncm.startsWith('0401') || ncm.startsWith('0402') || ncm.startsWith('0403') ||
    pfx(['0407','0408']) ||
    pfx(['0701','0702','0703','0704','0705','0706','0707','0708','0709','0710','0713','0714']) ||
    pfx(['0801','0803','0804','0805','0806','0807','0808','0810']) ||
    pfx(['1006']) ||
    pfx(['1101','1104','1901'])
  );
  if(monofasico){
    sug.pisCofinsCst='06'; sug.pisAliq='0%'; sug.cofinsAliq='0%';
    sug.pisNota='Produto monofásico (bebida fria / recolhimento concentrado na indústria) — na revenda a alíquota é zero (CST 06).';
    sug.pisFund='Lei 10.147/2000, arts. 1º e 2º|http://www.planalto.gov.br/ccivil_03/LEIS/L10147.htm';
  } else if(cestaBasica){
    sug.pisCofinsCst='06'; sug.pisAliq='0%'; sug.cofinsAliq='0%';
    sug.pisNota='Produto de cesta básica com alíquota zero legal (CST 06).';
    sug.pisFund='Lei 10.925/2004|http://www.planalto.gov.br/ccivil_03/_ato2004-2006/2004/lei/l10.925.htm';
    sug.obs.push('Confirme se este NCM está na lista de cesta básica com alíquota zero vigente.');
  } else {
    sug.pisCofinsCst='01'; sug.pisAliq='0,65%'; sug.cofinsAliq='3%';
    sug.pisNota='Produto tributado normalmente por PIS/COFINS na saída (CST 01).';
    sug.pisFund='Lei 10.637/2002, art. 2º|http://www.planalto.gov.br/ccivil_03/LEIS/2002/L10637.htm';
  }
  sug.ipiCst='53'; sug.ipiAliq='0%';

  // COM ST
  if(['10','30','60','70'].includes(cst2) || item.temST){
    sug.cfop='5405'; sug.cst='60';
    sug.motivo='Produto sujeito a substituição tributária. Na revenda dentro do RJ vocês são o contribuinte substituído (o ICMS-ST já foi recolhido antes na cadeia), então a saída não tem novo destaque de ICMS.';
    sug.ref='CFOP 5405 = venda interna de mercadoria de terceiros com ICMS-ST já recolhido (condição de substituído). CST 60 = ICMS cobrado anteriormente por ST.';
    if(cst2==='70') sug.obs.push('Na compra veio CST 70 (ST + redução de base). Na sua saída como substituído normalmente vira 60.');
    if(cst2==='10') sug.obs.push('O fornecedor usou CST 10 (ele é o substituto que recolheu). Como você revende, sua saída vira CST 60 (substituído).');
    return sug;
  }
  // TRIBUTADO NORMAL
  if(cst2==='00'){
    sug.cfop='5102'; sug.cst='00';
    sug.motivo='Produto tributado normalmente pelo ICMS, sem substituição tributária. Revenda interna com destaque normal de ICMS.';
    sug.ref='CFOP 5102 = venda de mercadoria de terceiros dentro do estado. CST 00 = tributada integralmente.';
    return sug;
  }
  // REDUÇÃO DE BASE na entrada -> vocês cadastram como 00 (tributado integral) na saída
  if(cst2==='20'){
    sug.cfop='5102'; sug.cst='00';
    sug.motivo='O produto veio com redução de base de cálculo na compra, mas na revenda de vocês ele é tributado integralmente. Por isso a saída fica CST 00.';
    sug.ref='CFOP 5102 = venda interna de terceiros. CST 00 = tributada integralmente.';
    sug.obs.push('A redução de base do fornecedor não se repassa na sua venda. Confirme com a contabilidade se este produto realmente sai como 00.');
    return sug;
  }
  // DIFERIMENTO
  if(cst2==='51'){
    sug.cfop='5102'; sug.cst='00';
    sug.motivo='A compra veio com diferimento (CST 51), específico daquela operação. No varejo, a revenda normalmente é tributada normal (00).';
    sug.ref='CST 51 = diferimento (não se mantém na saída do varejo).';
    sug.obs.push('Confirme com a contabilidade — o provável é 5102 / CST 00.');
    return sug;
  }
  // ISENTO / NÃO TRIBUTADO
  if(cst2==='40'||cst2==='41'){
    sug.cfop='5102'; sug.cst=cst2;
    sug.motivo='Produto isento/não tributado. Tende a manter na saída interna.';
    sug.ref='CST '+cst2+' = '+(cst2==='40'?'isenta':'não tributada')+'.';
    sug.obs.push('Confirme se a isenção vale também para a sua venda no RJ.');
    return sug;
  }
  // fallback
  sug.cfop='5102'; sug.cst=(cst2||'00');
  sug.motivo='Situação fora dos padrões mais comuns.';
  sug.ref='';
  sug.obs.push('Caso não mapeado. Confira o CFOP/CST com a contabilidade.');
  return sug;
}

// ---------- Busca ----------
function normaliza(s){ return (s||'').toString().toLowerCase().replace(/\s+/g,' ').trim(); }
function buscar(){
  const q=normaliza(document.getElementById('busca').value);
  const area=document.getElementById('area');
  if(!q){ area.innerHTML=''; return; }
  if(!carregado){ toast('Base ainda carregando, tente em 1 segundo.'); return; }
  const qDigitos=q.replace(/\D/g,'');
  // 1) match exato por EAN
  let achados=[];
  if(qDigitos.length>=8){
    const semZero=s=>String(s||'').replace(/\D/g,'').replace(/^0+/,'');
    const alvo=semZero(qDigitos);
    // 1) igual exato  2) ignorando zeros a esquerda  3) um contido no outro (EAN-13 x UPC-12)
    achados=INDICE.filter(it=>{
      if(!it.ean) return false;
      const e=String(it.ean).replace(/\D/g,'');
      if(!e || e.length<8) return false;
      if(e===qDigitos) return true;
      const ez=semZero(e);
      if(ez===alvo) return true;
      return (ez.length>=8 && alvo.length>=8) && (ez.endsWith(alvo)||alvo.endsWith(ez));
    });
    // 4) ainda nada? procura tambem no codigo do fornecedor (cProd)
    if(!achados.length) achados=INDICE.filter(it=>String(it.cprod||'').replace(/\D/g,'')===qDigitos);
  }
  // 2) por NCM
  if(!achados.length && qDigitos.length>=4 && qDigitos.length<=8){
    achados=INDICE.filter(it=>it.ncm && it.ncm.startsWith(qDigitos));
  }
  // 3) por nome
  if(!achados.length){
    achados=INDICE.filter(it=>normaliza(it.nome).includes(q));
  }
  if(!achados.length){ mostrarNaoAchado(q,qDigitos); return; }

  // agrupar por produto (ean+nome)
  const grupos={};
  achados.forEach(it=>{
    const k=(it.ean||'')+'|'+normaliza(it.nome);
    if(!grupos[k]) grupos[k]={itens:[],rep:it};
    grupos[k].itens.push(it);
  });
  const chaves=Object.keys(grupos);
  if(chaves.length>1){ mostrarLista(grupos,chaves); return; }
  mostrarFicha(grupos[chaves[0]]);
}

function mostrarLista(grupos,chaves){
  const area=document.getElementById('area');
  let h='<div class="card"><h2>'+chaves.length+' produtos encontrados</h2><div class="multi">';
  chaves.slice(0,60).forEach((k,i)=>{
    const g=grupos[k]; const it=g.rep;
    h+='<div class="multi-item" data-k="'+i+'"><div><div class="n">'+esc(it.nome)+'</div><div class="m">'+(it.ean?'Cód: '+it.ean+' · ':'')+'NCM '+it.ncm+' · '+g.itens.length+' compra(s)</div></div><div class="seta">›</div></div>';
  });
  h+='</div></div>';
  area.innerHTML=h;
  window._grupos=chaves.map(k=>grupos[k]);
  area.querySelectorAll('.multi-item').forEach(el=>{
    el.onclick=()=>mostrarFicha(window._grupos[parseInt(el.dataset.k)]);
  });
}

function mostrarFicha(grupo){
  const itens=grupo.itens.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const it=itens[0]; // mais recente
  const sug=derivarSaida(it);
  const cstEnt=(it.cst||it.csosn||'');
  const area=document.getElementById('area');

  // detectar divergências entre compras
  const ncmsSet=[...new Set(itens.map(x=>x.ncm).filter(Boolean))];
  const cstSet=[...new Set(itens.map(x=>x.cst||x.csosn).filter(Boolean))];

  let h='<div class="card resultado" style="display:block">';
  h+='<div class="res-head"><div class="nome">'+esc(it.nome)+'</div>'+(it.ean?'<div class="ean">'+it.ean+'</div>':'')+'</div>';

  // Ficha real (da XML)
  h+='<div class="bloco-titulo">Ficha fiscal real (como veio nas suas notas)</div>';
  h+='<div class="grid">';
  h+=fiscC('NCM',it.ncm||'—');
  h+=fisc('CEST',it.cest||'não tem');
  h+=fisc('Origem (compra)',it.orig?nomeOrigem(it.orig):'—');
  h+=fisc('CST na compra',cstEnt||'—');
  h+=fisc('CFOP na compra',it.cfop||'—');
  h+=fisc('ICMS',it.pICMS?it.pICMS+'%':'—');
  if(it.pFCP) h+=fisc('FCP',it.pFCP+'%');
  if(it.pRedBC) h+=fisc('Red. base (compra)',it.pRedBC+'%');
  h+=fisc('Tem ST?',it.temST?'Sim':'Não');
  h+='</div>';

  // Divergências
  if(ncmsSet.length>1 || cstSet.length>1){
    h+='<div class="divergencia"><b>Atenção:</b> este produto apareceu com classificações diferentes entre notas.';
    if(ncmsSet.length>1) h+=' NCM: '+ncmsSet.join(', ')+'.';
    if(cstSet.length>1) h+=' CST/CSOSN: '+cstSet.join(', ')+'.';
    h+=' Verifique qual é o correto.</div>';
  }

  // Sugestão de saída
  h+='<div class="bloco-titulo">Sugestão para a sua venda (saída)</div>';
  h+='<div class="sugestao">';
  h+='<div class="par">';
  h+='<div class="item"><div class="lbl">CFOP saída</div><div class="big">'+sug.cfop+' '+cop(sug.cfop)+'</div></div>';
  h+='<div class="item"><div class="lbl">CST ICMS saída</div><div class="big">'+sug.cst+' '+cop(sug.cst)+'</div></div>';
  h+='<div class="item"><div class="lbl">Origem</div><div class="big">'+sug.origSaida+' '+cop(sug.origSaida)+'</div></div>';
  h+='</div>';
  h+='<div class="motivo">'+sug.motivo+'</div>';
  if(sug.ref) h+='<div class="ref">'+sug.ref+'</div>';
  if(sug.origEntrada!=='0' && sug.origEntrada!==sug.origSaida)
    sug.obs.push('Na compra a origem veio como '+sug.origEntrada+' (ótica do fornecedor). Na revenda de vocês sugerimos 0 (Nacional). Se este produto for importado por vocês, ajuste.');
  sug.obs.forEach(o=>{ h+='<div class="aviso"><b>Confira:</b> '+o+'</div>'; });
  h+='</div>';

  // Bloco PIS / COFINS / IPI
  h+='<div class="bloco-titulo">PIS / COFINS / IPI (saída)</div>';
  h+='<div class="sugestao">';
  h+='<div class="par">';
  h+='<div class="item"><div class="lbl">CST PIS</div><div class="big">'+sug.pisCofinsCst+' '+cop(sug.pisCofinsCst)+'</div></div>';
  h+='<div class="item"><div class="lbl">Alíq. PIS</div><div class="big">'+sug.pisAliq+'</div></div>';
  h+='<div class="item"><div class="lbl">CST COFINS</div><div class="big">'+sug.pisCofinsCst+' '+cop(sug.pisCofinsCst)+'</div></div>';
  h+='<div class="item"><div class="lbl">Alíq. COFINS</div><div class="big">'+sug.cofinsAliq+'</div></div>';
  h+='</div>';
  h+='<div class="par">';
  h+='<div class="item"><div class="lbl">CST IPI</div><div class="big">'+sug.ipiCst+' '+cop(sug.ipiCst)+'</div></div>';
  h+='<div class="item"><div class="lbl">Alíq. IPI</div><div class="big">'+sug.ipiAliq+'</div></div>';
  h+='</div>';
  h+='<div class="motivo">'+sug.pisNota+' IPI de saída é sempre 53 (alíquota 0%).</div>';
  if(sug.pisFund){ const fp=sug.pisFund.split('|'); h+='<div class="ref">Fundamento: <a href="'+fp[1]+'" target="_blank" rel="noopener" style="color:var(--azul)">'+fp[0]+'</a></div>'; }
  h+='</div>';

  h+='<div class="disclaimer"><b>Sugestão orientativa.</b> Confirme com a contabilidade.</div>';

  // Ocorrências
  h+='<div class="bloco-titulo">Onde apareceu ('+itens.length+' compra(s))</div>';
  h+='<div class="ocorrencias"><table><thead><tr><th>Data</th><th>Fornecedor</th><th>NF</th><th>CFOP</th><th>CST</th></tr></thead><tbody>';
  itens.slice(0,15).forEach(x=>{
    h+='<tr><td>'+fmtData(x.data)+'</td><td>'+esc(x.fornNome)+'</td><td>'+x.nNF+'</td><td>'+x.cfop+'</td><td>'+(x.cst||x.csosn)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='</div>';

  area.innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}

async function consultarNCMWeb(ncm){
  const el=document.getElementById('webResult');
  try{
    const r=await fetch('https://brasilapi.com.br/api/ncm/v1/'+ncm);
    if(!r.ok) throw new Error('não encontrado');
    const d=await r.json();
    el.innerHTML='<b>NCM '+(d.codigo||ncm)+'</b><br>'+esc(d.descricao||'(sem descrição)')+
      '<div class="aviso" style="margin-top:8px"><b>Só descrição:</b> a web traz o texto oficial do NCM. CEST, CST, CFOP e alíquotas você define pela sua operação/contabilidade.</div>';
  }catch(e){
    // tentar busca por descrição
    el.innerHTML='NCM '+ncm+' não encontrado diretamente. <a href="https://brasilapi.com.br/api/ncm/v1?search='+encodeURIComponent(ncm)+'" target="_blank">Ver busca ampla</a>';
  }
}

// ---------- helpers ----------
function fisc(lbl,val){ return '<div class="fisc"><div class="lbl">'+lbl+'</div><div class="val">'+esc(val)+'</div></div>'; }
function fiscC(lbl,val){ return '<div class="fisc"><div class="lbl">'+lbl+'</div><div class="val">'+esc(val)+' '+cop(val)+'</div></div>'; }
function cop(v){ v=(''+v).replace(/'/g,''); if(!v||v==='—'||v==='não tem') return ''; return '<button class="cbtn" onclick="copiar(\''+v+'\',this)" title="Copiar '+v+'">⧉</button>'; }
function copiar(v,el){
  navigator.clipboard.writeText(v).then(()=>{
    const orig=el.textContent; el.textContent='✓'; el.classList.add('ok');
    toast('Copiado: '+v);
    setTimeout(()=>{ el.textContent=orig; el.classList.remove('ok'); },1200);
  }).catch(()=>toast('Não consegui copiar'));
}
function esc(s){ return (s||'').toString().replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtData(d){ if(!d) return '—'; const p=d.split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d; }
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

document.getElementById('btnBuscar').onclick=buscar;
document.getElementById('busca').addEventListener('keydown',e=>{ if(e.key==='Enter') buscar(); });

// ---------- Sincronizacao em nuvem (indice fiscal compacto) ----------
function indiceCompacto(){
  // 1 registro por produto (EAN+nome), guardando ate 3 ocorrencias recentes
  const mapa={};
  INDICE.forEach(it=>{
    const k=(it.ean||'')+'|'+(it.nome||'').toLowerCase().trim();
    if(!mapa[k]) mapa[k]={e:it.ean,n:it.nome,m:it.ncm,c:it.cest,f:it.cfop,s:it.cst,o:it.orig,
      pi:it.pICMS,pf:it.pFCP,pr:it.pRedBC,ps:it.pis,st:it.temST?1:0,cp:it.cprod,oc:[]};
    if(mapa[k].oc.length<3) mapa[k].oc.push({d:it.data,fn:it.fornNome,nf:it.nNF,f:it.cfop,s:it.cst||it.csosn});
    if((it.data||'')>(mapa[k].oc[0]?.d||'')){ mapa[k].m=it.ncm; mapa[k].s=it.cst; mapa[k].f=it.cfop; }
  });
  return Object.values(mapa);
}
function expandirIndice(comp){
  const out=[];
  comp.forEach(p=>{
    const base={ean:p.e,nome:p.n,ncm:p.m,cest:p.c,cfop:p.f,cst:p.s,csosn:'',orig:p.o,
      pICMS:p.pi,pFCP:p.pf,pRedBC:p.pr,pis:p.ps,temST:!!p.st,cprod:p.cp,unid:''};
    (p.oc&&p.oc.length?p.oc:[{}]).forEach(o=>{
      out.push(Object.assign({},base,{data:o.d||'',fornNome:o.fn||'',nNF:o.nf||'',cfop:o.f||p.f,cst:o.s||p.s}));
    });
  });
  return out;
}
async function garantirLogin(){
  for(let i=0;i<40 && !window._fbPronto;i++) await new Promise(r=>setTimeout(r,100));
  if(window._fbUser) return true;
  const email=prompt('E-mail do sistema (mesmo login do Gestao):'); if(!email) return false;
  const senha=prompt('Senha:'); if(!senha) return false;
  try{ await window.fbLogin(email,senha); return true; }
  catch(e){ toast('Login falhou: '+(e.code||e.message)); return false; }
}
async function enviarNuvem(){
  if(!INDICE.length){ toast('Base local vazia. Abra num navegador que tenha as notas.'); return; }
  if(!await garantirLogin()) return;
  const btn=document.getElementById('btnEnviarNuvem'); btn.disabled=true; btn.textContent='Enviando...';
  try{
    const comp=indiceCompacto();
    await window.fbSalvar('fiscalBaseProdutos',comp);
    toast(comp.length+' produtos enviados para a nuvem');
  }catch(e){ toast('Erro ao enviar: '+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent='Enviar base p/ nuvem'; }
}
async function baixarNuvem(){
  if(!await garantirLogin()) return;
  const btn=document.getElementById('btnBaixarNuvem'); btn.disabled=true; btn.textContent='Baixando...';
  try{
    const comp=await window.fbCarregar('fiscalBaseProdutos');
    if(!comp){ toast('Nenhuma base na nuvem ainda. Envie primeiro no navegador que tem as notas.'); return; }
    INDICE=expandirIndice(comp); carregado=true;
    localStorage.setItem('fiscal_base_nuvem',JSON.stringify(comp));
    document.getElementById('baseStatus').innerHTML='<b>'+comp.length+'</b> produtos (nuvem)';
    toast(comp.length+' produtos carregados da nuvem');
  }catch(e){ toast('Erro ao baixar: '+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent='Baixar da nuvem'; }
}
document.getElementById('btnEnviarNuvem').onclick=enviarNuvem;
document.getElementById('btnBaixarNuvem').onclick=baixarNuvem;

// Ao abrir: usa IndexedDB local; se vazio, tenta a copia da nuvem guardada localmente
carregarBase().then(()=>{
  if(!INDICE.length){
    try{
      const cache=localStorage.getItem('fiscal_base_nuvem');
      if(cache){ INDICE=expandirIndice(JSON.parse(cache)); carregado=true;
        document.getElementById('baseStatus').innerHTML='<b>'+JSON.parse(cache).length+'</b> produtos (nuvem)'; }
    }catch(e){}
  }
});
</script>
